# PDF 转 Markdown 配置文件

# PaddleOCR-VL VLM 推理服务
# 服务: paddleocr genai_server (端口 8118)
# 模型: PaddleOCR-VL-1.6-0.9B (vLLM 后端，OpenAI Compatible API)
ocr:
  engine: "paddleocr"
  concurrency: 3                  # 客户端并发请求数

paddleocr:
  api_base: "http://localhost:8118/v1"    # VLM 推理服务地址
  model: "PaddleOCR-VL-1.6-0.9B"         # 模型名称
  timeout: 300                            # 请求超时（秒）
  max_retries: 3                          # 最大重试次数
  temperature: 0.0                        # 采样温度（0=greedy）
  max_tokens: 8192                        # 最大输出 token

pdf:
  dpi: 300
  format: "png"               # 磁盘保存格式
  ocr_format: "jpeg"          # OCR 传输格式

# 页面过滤
page_filter:
  skip_front_pages: 2              # 跳过前 N 页（封面/内封）
  min_elements: 4                  # 元素数低于此值视为可疑
  max_text_len: 2000               # 总文本低于此值判定为广告
  max_repeat_ratio: 0.80           # 文本重复率高于此值判定为封面
  max_table_elements: 5            # 纯表格页元素上限
  min_table_text_len: 5000         # 纯表格页文本下限
  min_line_repeat_ratio: 0.50      # 纯表格页行重复率下限
  frag_ad_min_elements: 6          # 碎片化广告：最少元素数
  frag_ad_short_len: 100           # 碎片化广告：元素文字长度上限
  frag_ad_short_ratio: 0.80        # 碎片化广告：短元素占比下限
  classified_ad_min_contacts: 3    # 分类广告：联系方式模式最少数量

# 翻译服务（sisyphus，由外部项目管理）
translation:
  enabled: false
  api_base: "http://localhost:8080/v1"
  api_key: "not-needed"
  model: "sisyphus"
  target_language: "简体中文"
  timeout: 300
  batch_size: 3
  max_tokens: 4096
  temperature: 0.3
  repeat_penalty: 1.1
  disable_thinking: true

output:
  page_separator: true
  single_file: true

paths:
  input_dir: "input"
  output_dir: "output"
  log_dir: "logs"
