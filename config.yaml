# PDF 转 Markdown 配置文件

# PaddleOCR-VL VLM 推理服务
# 服务: paddleocr genai_server (端口 8118)
# 模型: PaddleOCR-VL-1.6-0.9B (vLLM 后端，OpenAI Compatible API)
ocr:
  engine: "paddleocr"
  concurrency: 3                  # 客户端并发请求数

paddleocr:
  api_base: "http://localhost:8118/v1"    # VLM 推理服务地址
  model: "PaddleOCR-VL-1.6-0.9B"         # 模型名称
  timeout: 300                            # 请求超时（秒）
  max_retries: 3                          # 最大重试次数
  temperature: 0.0                        # 采样温度（0=greedy）
  max_tokens: 8192                        # 最大输出 token

pdf:
  dpi: 300
  format: "png"               # 磁盘保存格式
  ocr_format: "jpeg"          # OCR 传输格式

# 页面过滤：跳过封面
page_filter:
  skip_front_pages: 2              # 跳过前 N 页（封面/内封）

# 翻译服务（sisyphus，由外部项目管理）
translation:
  enabled: false
  api_base: "http://localhost:8080/v1"
  api_key: "not-needed"
  model: "sisyphus"
  target_language: "简体中文"
  timeout: 300
  batch_size: 3
  max_tokens: 4096
  temperature: 0.3
  repeat_penalty: 1.1
  disable_thinking: true

output:
  page_separator: true
  single_file: true

paths:
  input_dir: "input"
  output_dir: "output"
  log_dir: "logs"
