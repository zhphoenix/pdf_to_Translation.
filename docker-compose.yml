# PDF 转 Markdown - 服务编排
#
# PaddleOCR-VL VLM 推理: http://localhost:8118 (端口 8118)
# 翻译服务: http://localhost:8080/v1 (外部: /mnt/e/ai-platform/sisyphus/)
#
# 显存注意: RTX 5060 Ti 16GB 不足以同时运行 OCR 和翻译

services:
  # PaddleOCR-VL VLM 推理服务 (端口 8118)
  # 模型: PaddleOCR-VL-1.6-0.9B (vLLM 后端)
  paddleocr-genai:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-nvidia-gpu
    container_name: paddleocr-genai
    restart: unless-stopped
    ports:
      - "8118:8118"
    volumes:
      - /mnt/g/models/OCR/PaddleOCR-VL-1.6:/home/paddleocr/.paddlex/official_models/PaddleOCR-VL-1.6
      - ./paddlex_cache/temp:/home/paddleocr/.paddlex/temp
      - ./paddlex_cache/func_ret:/home/paddleocr/.paddlex/func_ret
      - ./paddlex_cache/locks:/home/paddleocr/.paddlex/locks
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - paddleocr
      - genai_server
      - --model_name
      - PaddleOCR-VL-1.6-0.9B
      - --host
      - 0.0.0.0
      - --port
      - "8118"
      - --backend
      - vllm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8118/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
